; ТМГУ НЕТ, операторский терминал на аппаратуре сопряжения (АС), консоль SIMH
; на его линии; сеанс ведут expect/send. Запускается из sim/as.sh в sim/run
; (образ правит sim/muxvt.py: ТЕРМ АС,VТ:13, ОТАС 13, лог.1, Е39 снят).
; Номер линии SIMH десятичный: физ. 013 = tty11.
set -n console log=log.txt
set console debug=log
set cpu idle
set cpu autotime=on
set tty mux

attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin
attach -n md06 2052.bin
attach -e md07 2053.bin
attach -e md05 krab2063.bin
attach -e md00 sbor2048.bin
attach -e md01 svs2048.bin
attach -e md02 alt2048.bin
set mg4 es

attach -n prn0 output.txt
; Терминал на АС: линия мультиплексора, на ней консоль SIMH.
set tty11 mux
set tty11 authbs
attach tty11 console

d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

expect -r "CM1П:.*\n"
load boot_dispak.b6
run 2000
echo
echo ### BOOTED
send "\r"
expect "(01)"
go
echo
echo ### PROMPT
send "ВРЕ\r"
expect -r "B.EM[^:]*:[0-9][0-9].[0-9][0-9].[0-9][0-9]"
go
echo
echo ### ВРЕ OK
quit
