; Загрузка Диспака со штатного sbor2053.bin (К-71) с ДКС: линия 5 SIMH -
; терминал Э-60, сеанс на ней по telnet (ОС даёт ей терминал 031).
; Запускается из sim/term.sh dks в каталоге прогона (sim/run).
set -n console log=log.txt
set console debug=log
set cpu idle
set cpu autotime=on
set tty dks
set dks debug=RING

attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin
attach -n md06 2052.bin
attach -e md07 2053.bin
attach -e md05 krab2063.bin
attach -e md00 sbor2048.bin
attach -e md01 svs2048.bin
attach -e md02 alt2048.bin
set mg4 es

attach -n prn0 output.txt
attach tty1 %PORT%
attach tty1 console
set tty1 authbs
set -n tty1 log=tty1.txt
set tty5 mux
set tty lineorder=5
set -n tty5 log=tty5.txt
show tty

d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

expect -r "CM1П:.*\n"
load boot_dispak.b6
run 2000

echo ### BOOTED
go
