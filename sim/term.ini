; Загрузка Диспака с собранного 2053.bin для сеанса с терминала по telnet.
; Запускается из sim/term.sh в каталоге прогона (sim/run).
set -n console log=log.txt
set console debug=log
set cpu idle
set cpu autotime=on
set dks debug=KADOPAM

attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin
attach -n md06 2052.bin
attach -e md07 2053.bin
attach -e md05 krab2063.bin
attach -e md00 sbor2048.bin
attach -e md01 svs2048.bin
attach -e md02 alt2048.bin
set mg4 es

attach -n prn0 output.txt
attach tty1 %PORT%
attach tty1 console
set tty1 authbs
set -n tty1 log=tty1.txt
set tty2 authbs
set -n tty2 log=tty2.txt

d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

expect -r "CM1П:.*\n"
load boot_dispak.b6
run 2000

echo ### BOOTED
go
