; ТМГУ ДА и один операторский терминал: ТЕРМ АС,VТ:13, ОТАС 13 (8-ичные), лог.1.
; Образ правят sim/muxvt.py (… 13) и sim/tmgu.py. Терминал стоит за
; концентратором на консуле 0: SIMH после обмена ключами шлёт 041 с физ. 013.
; Номера линий SIMH (tty, lineorder) десятичные: 013 = 11; правит sim/tmguop.sh.
; Запускается из sim/tmguop.sh в sim/run; останавливает его скрипт.
set -n console log=log.txt
set console debug=log
set cpu idle
set cpu autotime=on
set tty tmgutrace=13

attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin
attach -n md06 2052.bin
attach -e md07 2053.bin
attach -e md05 krab2063.bin
attach -e md00 sbor2048.bin
attach -e md01 svs2048.bin
attach -e md02 alt2048.bin
set mg4 es

attach -n prn0 output.txt
attach tty1 %PORT%
attach tty1 console
set tty1 authbs
set -n tty1 log=tty1.txt
; Линия мультиплексора 13: видно, не пишет ли ОС лог.1 мимо ТЕРМАС.
set tty13 mux
set tty lineorder=13
set -n tty13 log=tty13.txt

d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

load boot_dispak.b6
echo ### BOOTED
run 2000
; После SIGTERM от sim/tmguop.sh go прерывается и выполняется остальное.
; e @ИМЯ: адрес метки берёт sim/tmguop.sh из mott.be.tab / termas.be.tab.
; ТАС+ФИЗ (2460 = ТАС+013) правит sim/tmguop.sh; ТСЛ+0..1 (ЛОГ.1 = ТСЛ+0), ТСЛ+25; ТНФ+0, ТНФ+24.
e @АСОТ
e @СЛОN
e @ШКВЫД
e @ШЗПРИМ
e @ШКОКВД
e @ШКОРАБ
e @ШКНОВ
e @ШКАС
e @ШКОПТТ
e 2446
e 2460
e 2365-2366
e 2416
e 40451
e 40501
e 40025
e 40123
echo ### END
quit
