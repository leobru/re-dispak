; Загрузка Диспака с ТМГУ ДА (ТЕРМАС в листе 020, ВХПУСК после ПЕРЕПС).
; Образ правит sim/tmgu.py. Запускается из sim/tmgu.sh в sim/run.
set -n console log=log.txt
set console debug=log
set cpu idle
set cpu autotime=on
set tty debug
set tty tmgu

attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin
attach -n md06 2052.bin
attach -e md07 2053.bin
attach -e md05 krab2063.bin
attach -e md00 sbor2048.bin
attach -e md01 svs2048.bin
attach -e md02 alt2048.bin
set mg4 es

attach -n prn0 output.txt
attach tty1 console
set tty1 authbs
set -n tty1 log=tty1.txt

d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

load boot_dispak.b6
br 4440
run 2000
nobreak
step 5000000

; МПРП, ППК*, ШКАС, ТАС1, ШКОРАБ, ШКНОВ, ЗАНЯТА, ШКСВН, ШКИВ, ШКВЫД
e 1164
e 40025
e 40123
e 77025
e 2446
e 77021
e 77024
e 442
e 446
e 2077
e 77012
e 40366
e 40124

echo ### BOOTED
quit
