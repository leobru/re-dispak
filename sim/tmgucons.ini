; ТМГУ ДА, операторский терминал за концентратором на консоли SIMH.
; Запускается из sim/tmgucons.sh в sim/run (образ правят sim/muxvt.py и
; sim/tmgu.py: ТЕРМ АС,VТ:13, ОТАС 13, лог.1). Номер линии SIMH десятичный:
; физ. 013 = tty11, sim/tmgucons.sh правит его по PHYS.
set -n console log=log.txt
set console debug=log
set cpu idle
set cpu autotime=on
set tty tmgu

attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin
attach -n md06 2052.bin
attach -e md07 2053.bin
attach -e md05 krab2063.bin
attach -e md00 sbor2048.bin
attach -e md01 svs2048.bin
attach -e md02 alt2048.bin
set mg4 es

attach -n prn0 output.txt
; Терминал за концентратором: линия мультиплексора, на ней консоль SIMH.
set tty13 mux
set tty13 authbs
attach tty13 console

d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

load boot_dispak.b6
run 2000
