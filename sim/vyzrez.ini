; Трасса команд после ВЫЗРЕЗ -> ТВ41: кто забирает заявку из ШКОРАБ.
; Конфигурация как sim/tmguop.ini. Адреса — для сборки без правки E
; (tools/tmgu_revert.py E); после правок пересчитать по tools/labels.py.
; Запуск: INI=sim/vyzrez.ini TIMEOUT=150 sim/tmguop.sh
; Запускается из sim/tmguop.sh в sim/run; останавливает его скрипт.
set -n console log=log.txt
set console debug=log
set cpu idle
set cpu autotime=on
set tty tmgutrace=13

attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin
attach -n md06 2052.bin
attach -e md07 2053.bin
attach -e md05 krab2063.bin
attach -e md00 sbor2048.bin
attach -e md01 svs2048.bin
attach -e md02 alt2048.bin
set mg4 es

attach -n prn0 output.txt
attach tty1 %PORT%
attach tty1 console
set tty1 authbs
set -n tty1 log=tty1.txt
; Линия мультиплексора 13: видно, не пишет ли ОС лог.1 мимо ТЕРМАС.
set tty13 mux
set tty lineorder=13
set -n tty13 log=tty13.txt

d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

load boot_dispak.b6
echo ### BOOTED
; ВЫЗРЕЗ -> ТВ41 (17602), затем трасса команд в log.txt
br 17602
go
nobreak 17602
echo ### AT 17602
e 77017
e 2077
set cpu debug
step 40000
set nodebug
set cpu nodebug
echo ### AFTER TRACE
e 77017
e 2077
echo ### END
quit
