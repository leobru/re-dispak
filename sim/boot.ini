; Загрузка Диспака с собранного 2053.bin и прогон задачи с перфоленты.
; Запускается из sim/run.sh в каталоге прогона (sim/run).
set -n console log=log.txt
set console debug=log
set cpu idle
set cpu autotime=on
; Каждое обращение 032/0132 (КАДОПАМ) - строка в log.txt.
set dks debug=KADOPAM

attach -n drum0 drum1x.bin
attach -n drum1 drum2x.bin
attach -n md06 2052.bin
attach -e md07 2053.bin
attach -e md05 krab2063.bin
attach -e md00 sbor2048.bin
attach -e md01 svs2048.bin
attach -e md02 alt2048.bin
set mg4 es

attach -n prn0 output.txt
attach tty1 console
set tty1 authbs
set -n tty1 log=tty1.txt

at -t fs0 input.txt

; Обнуление первого листа памяти, как с пульта после включения.
d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

expect -r "CM1П:.*\n"
load boot_dispak.b6
run 2000

echo ### BOOTED
; Ввод с ФС8.
d 6 1
d 5 10
set cpu req
expect -r "Л[01].*\n"
go

send after=1000000 "WCPP\r"
expect -p -r "4199.*\n" send after=10000000 "WCPP\r"; go
expect -c "KЗ" step 10000000
expect -c "HET\r\n" step 10000
go
echo ### JOB DONE
; Включение АЦПУ (ONL A0).
d 6 10
d 5 1
set cpu req
expect -r "ECT.*\n"
go

; Конец печати видит sim/run.sh по output.txt и останавливает SIMH.
go
